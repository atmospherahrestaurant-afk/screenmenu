<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosferah Restaurant - Signature Showcase</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent-color: #f3c614;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            width: 100%;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-box {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            height: 24px;
            object-fit: contain;
        }

        .brand-text h1 {
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--text-color);
        }

        .brand-text p {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-live {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-live::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
        }

        .icon-fullscreen {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .showcase-container {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            align-items: center;
            gap: 4rem;
            width: 100%;
        }

        .content-side {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .category-tag {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-tag::before {
            content: '';
            width: 4px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        .product-title {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.1;
            color: var(--text-color);
            min-height: 110px;
            transition: opacity 0.3s ease;
        }

        .pricing-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        .price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .item-counter {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .nav-btn {
            background-color: #161616;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .nav-btn:hover {
            border-color: var(--accent-color);
        }

        .progress-bar-container {
            width: 250px;
            height: 3px;
            background-color: #222;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            transition: width 0.1s linear;
        }

        .image-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .image-frame {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            overflow: hidden;
            background-color: #161616;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .featured-label {
            margin-top: 1.2rem;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            font-weight: 600;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid #161616;
            width: 100%;
        }

        .developer-credit span {
            color: var(--accent-color);
            font-weight: 600;
        }

        @media(max-width: 900px) {
            .showcase-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 2rem;
            }
            .content-side {
                align-items: center;
            }
            .product-title {
                font-size: 2.2rem;
                min-height: auto;
            }
            .image-frame {
                width: 280px;
                height: 280px;
            }
            header, footer {
                padding: 1rem;
            }
        }
    </style>
</head>

        const totalProducts = products.length;
        const intervalTime = 6000; // 6 seconds per item

        let currentIndex = 0; // 0-based index for array
        let timer = null;
        let progressInterval = null;
        let startTime = null;

        const imgElement = document.getElementById('prod-img');
        const titleElement = document.getElementById('prod-title');
        const priceElement = document.getElementById('prod-price');
        const counterElement = document.getElementById('prod-counter');
        const catTagElement = document.getElementById('cat-tag');
        const progressFill = document.getElementById('progress-fill');
        
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        function updateDisplay(index) {
            currentIndex = index;
            const currentItem = products[currentIndex];
            const fileNumber = currentIndex + 1;
            
            // Update image source sequentially from 1.png to 357.png
            imgElement.src = `${fileNumber}.png`;
            imgElement.alt = `Product ${fileNumber}`;

            // Update text content from exact product sequence
            titleElement.textContent = currentItem.name;
            priceElement.textContent = currentItem.price;
            counterElement.textContent = `#${fileNumber} / ${totalProducts}`;
            catTagElement.textContent = currentItem.category;

            resetTimer();
        }

        function nextProduct() {
            let nextIdx = currentIndex + 1;
            if (nextIdx >= totalProducts) {
                nextIdx = 0; // Auto-restart from 1st product after 357
            }
            updateDisplay(nextIdx);
        }

        function prevProduct() {
            let prevIdx = currentIndex - 1;
            if (prevIdx < 0) {
                prevIdx = totalProducts - 1;
            }
            updateDisplay(prevIdx);
        }

        function resetTimer() {
            clearInterval(timer);
            clearInterval(progressInterval);
            
            startTime = Date.now();
            
            // Progress bar animation loop
            progressInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let pct = (elapsed / intervalTime) * 100;
                if (pct > 100) pct = 100;
                progressFill.style.width = pct + '%';
            }, 50);

            // Auto advance timer after 6 seconds
            timer = setInterval(() => {
                nextProduct();
            }, intervalTime);
        }

        // Event Listeners for manual navigation controls
        nextBtn.addEventListener('click', () => {
            nextProduct();
        });

        prevBtn.addEventListener('click', () => {
            prevProduct();
        });

        // Fullscreen toggle functionality
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Initialize first run
        updateDisplay(0);
    </script>
